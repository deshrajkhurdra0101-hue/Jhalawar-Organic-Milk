<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Jhalawar Organic Milk</title>

    <link rel="stylesheet" href="admin.css">
</head>


<body>

    <main class="admin-login-page">

        <section class="login-card">

            <div class="login-logo">

                <div class="login-logo-circle">
                    🥛
                </div>

                <h1>
                    Jhalawar Organic Milk
                </h1>

                <p>
                    Admin Panel
                </p>

            </div>


            <div class="login-heading">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Login to manage your business website.
                </p>

            </div>


            <form id="admin-login-form">

                <div class="form-group">

                    <label for="admin-email">
                        Email / Username
                    </label>

                    <input
                        type="text"
                        id="admin-email"
                        name="admin-email"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        name="admin-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="login-error"
                    class="login-error"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="login-footer">

                <p>
                    Authorized business owner only.
                </p>

                <a href="index.html">
                    ← Back to Website
                </a>

            </div>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
